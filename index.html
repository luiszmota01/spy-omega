<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<title>Instagram</title>
<style>
@font-face{font-family:InterLocal;src:url("fonts/e4af272ccee01ff0-s.p.woff2") format("woff2");font-display:swap}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:InterLocal,Arial,sans-serif}
button,input{font:inherit}button{border:0;cursor:pointer}body{overflow-x:hidden}.app{min-height:100vh;background:#000}
.top{background:#00d26a;color:#001b0d;padding:10px 16px;text-align:center;font-size:12px;font-weight:800;letter-spacing:.04em}
.wrap{width:100%;max-width:420px;margin:auto;padding:28px 20px}
.center{min-height:calc(100vh - 42px);display:flex;flex-direction:column;justify-content:center}
.logo{width:64px;height:64px;margin:0 auto 28px;display:block}.title{text-align:center;font-size:21px;line-height:1.25;margin:0 0 10px}.sub{text-align:center;color:#a7a7a7;font-size:13px;line-height:1.55;margin:0 0 24px}
.field{position:relative}.field span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#777}.field input{width:100%;background:#111;border:1px solid #292929;border-radius:12px;color:#fff;padding:14px 14px 14px 32px;outline:0}.field input:focus{border-color:#777}.cta{width:100%;margin-top:10px;padding:14px;border-radius:12px;background:#0095f6;color:#fff;font-weight:700}.cta:disabled{opacity:.4;cursor:not-allowed}.note{text-align:center;color:#777;font-size:12px;line-height:1.5;margin-top:14px}
.hidden{display:none!important}.profile-card{background:#101010;border:1px solid #252525;border-radius:18px;padding:22px;text-align:center}.avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;border:2px solid #222}.username{font-size:18px;font-weight:800;margin:12px 0 4px}.handle{color:#888;font-size:13px}.stats{display:flex;justify-content:center;gap:30px;margin:18px 0;color:#bbb;font-size:12px}.stats b{display:block;color:#fff;font-size:15px;margin-bottom:3px}.back{background:transparent;color:#aaa;padding:8px 0;margin-bottom:12px}.loader{width:46px;height:46px;border:3px solid #292929;border-top-color:#0095f6;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px}@keyframes spin{to{transform:rotate(360deg)}}
.ig{min-height:100vh;background:#000;max-width:560px;margin:auto;padding-bottom:58px}.ig-head{height:52px;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;background:#000;z-index:3}.ig-brand{font-size:20px;font-weight:800}.head-icons{display:flex;gap:18px;font-size:21px}.stories{display:flex;gap:13px;overflow:auto;padding:12px 12px 10px;border-bottom:1px solid #1c1c1c}.story{min-width:62px;text-align:center;font-size:11px;color:#ddd}.story img{width:58px;height:58px;border-radius:50%;object-fit:cover;padding:2px;border:2px solid #d62976}.post{border-bottom:1px solid #202020}.post-head{display:flex;align-items:center;gap:10px;padding:10px 12px}.post-head img{width:34px;height:34px;border-radius:50%;object-fit:cover}.post-name{font-size:13px;font-weight:700}.post-location{font-size:10px;color:#777;margin-top:2px}.post-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}.actions{display:flex;gap:17px;padding:10px 12px 5px;font-size:23px}.caption{padding:0 12px 13px;font-size:13px;line-height:1.4}.caption b{margin-right:5px}.nav{position:fixed;bottom:0;left:0;right:0;height:56px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:5;max-width:560px;margin:auto}.nav button{background:none;color:#aaa;font-size:21px}.nav button.active{color:#fff}.toast{position:fixed;left:50%;bottom:75px;transform:translateX(-50%);background:#222;border:1px solid #333;border-radius:10px;padding:10px 14px;font-size:12px;z-index:10}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
const $=s=>document.querySelector(s);
const root=$("#root");
const avatar="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=300&q=80";
const pics=[
"https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=900&q=80",
"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=900&q=80",
"https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=900&q=80"
];
let user="";
function logo(){return '<svg class="logo" viewBox="0 0 48 48" aria-label="Instagram"><defs><radialGradient id="g" cx="30%" cy="107%" r="150%"><stop offset="0" stop-color="#fdf497"/><stop offset=".45" stop-color="#fd5949"/><stop offset=".6" stop-color="#d6249f"/><stop offset=".9" stop-color="#285AEB"/></radialGradient></defs><rect x="1" y="1" width="46" height="46" rx="13" fill="url(#g)"/><rect x="13" y="13" width="22" height="22" rx="7" fill="none" stroke="#fff" stroke-width="2.6"/><circle cx="24" cy="24" r="6" fill="none" stroke="#fff" stroke-width="2.6"/><circle cx="31.5" cy="16.5" r="1.7" fill="#fff"/></svg>'}
function home(){
root.innerHTML='<div class="app"><div class="top">● &nbsp; CONSULTA GRATUITA LIBERADA PARA VOCÊ</div><main class="wrap center">'+logo()+'<h1 class="title">Você ganhou uma clonagem gratuita!</h1><p class="sub">Digite o @ de <b style="color:#fff">qualquer perfil</b> para iniciar sua consulta gratuita agora.</p><form id="form"><div class="field"><span>@</span><input id="user" aria-label="Nome de usuário" autocomplete="off" autocapitalize="none" placeholder="Usuário do Instagram"></div><button class="cta" id="go" disabled>Clonar perfil agora</button></form><p class="note">O app não envia notificações ou mensagens para a pessoa do perfil consultado.</p></main></div>';
const input=$("#user"),btn=$("#go");input.oninput=()=>btn.disabled=!input.value.trim();
$("#form").onsubmit=e=>{e.preventDefault();user=input.value.trim().replace(/^@/,"")||"usuario";confirmProfile()};
}
function confirmProfile(){
root.innerHTML='<div class="app"><main class="wrap center"><button class="back" id="back">← Voltar</button><div class="profile-card"><img class="avatar" src="'+avatar+'"><div class="username">'+user+'</div><div class="handle">@'+user+'</div><div class="stats"><div><b>1.2K</b>seguidores</div><div><b>342</b>seguindo</div><div><b>87</b>publicações</div></div><p class="sub" style="margin-bottom:10px">Encontramos este perfil. Confirme para continuar.</p><button class="cta" id="confirm">Confirmar perfil</button></div></main></div>';
$("#back").onclick=home;$("#confirm").onclick=loading;
}
function loading(){
root.innerHTML='<div class="app"><main class="wrap center" style="text-align:center"><div class="loader"></div><h2 class="title">Preparando o perfil...</h2><p class="sub">Estamos organizando as informações para abrir a visualização.</p></main></div>';
setTimeout(feed,1200);
}
function feed(){
const names=[user,user+"oficial","daily."+user];
root.innerHTML='<div class="ig"><header class="ig-head"><div class="ig-brand">Instagram</div><div class="head-icons">♡　✉</div></header><div class="stories">'+names.map((n,i)=>'<div class="story"><img src="'+(i?pics[i-1]:avatar)+'"><div>'+n.slice(0,10)+'</div></div>').join("")+'</div><section id="posts"></section><nav class="nav"><button class="active">⌂</button><button>⌕</button><button>＋</button><button>♡</button><button id="profileNav">◉</button></nav></div>';
$("#posts").innerHTML=names.map((n,i)=>'<article class="post"><div class="post-head"><img src="'+(i?pics[i-1]:avatar)+'"><div><div class="post-name">'+n+'</div><div class="post-location">São Paulo, Brasil</div></div></div><img class="post-img" src="'+pics[i]+'"><div class="actions"><span>♡</span><span>◯</span><span>➤</span></div><div class="caption"><b>'+n+'</b> Confira esta publicação e veja mais detalhes.</div></article>').join("");
$("#profileNav").onclick=()=>toast("Perfil pronto para receber os dados reais da API.");
}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
home();
})();
</script>
</body>
</html>
