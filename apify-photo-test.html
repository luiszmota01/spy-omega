<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste isolado — foto de perfil Apify</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{margin:0;min-height:100vh;background:#0b1020;color:#f4f6ff;display:grid;place-items:center;padding:24px;box-sizing:border-box}
main{width:min(100%,420px);background:#141b30;border:1px solid #293454;border-radius:20px;padding:24px;box-sizing:border-box;text-align:center}
h1{font-size:1.25rem;margin:0 0 8px}p{color:#b8c2df;line-height:1.5}
img{display:block;width:150px;height:150px;object-fit:cover;border-radius:50%;margin:22px auto;border:2px solid #6576ff;background:#222b43}
#status{font-weight:700;margin:14px 0;color:#ffd479}
small{display:block;color:#98a5c9;overflow-wrap:anywhere}
a{color:#aebaff}
</style>
</head>
<body>
<main>
<h1>Teste da foto de perfil do Apify</h1>
<p>Conta de teste: <strong>@wqiber</strong></p>
<img id="avatar" alt="Foto de perfil retornada pelo Apify">
<div id="status" role="status">Carregando imagem…</div>
<p>Teste isolado: o servidor tenta baixar a URL retornada pelo Apify e entregar a imagem ao navegador. Nenhum dado ou configuração de produção foi alterado.</p>
<small id="url"></small>
<p><a href="https://www.instagram.com/wqiber/" target="_blank" rel="noopener noreferrer">Abrir perfil no Instagram</a></p>
</main>
<script>
const img = document.getElementById('avatar');
const status = document.getElementById('status');
document.getElementById('url').textContent = 'Fonte: Apify → endpoint de teste no servidor (URL original não exposta nesta página).';
img.onload = () => { status.textContent = 'SUCESSO: o servidor baixou e entregou a imagem.'; status.style.color = '#7ee0ae'; };
img.onerror = async () => {
  status.textContent = 'FALHA: o servidor não conseguiu entregar a imagem. Consultando diagnóstico…';
  status.style.color = '#ff9d9d';
  try {
    const response = await fetch('/api/apify-photo-proxy');
    const data = await response.json();
    status.textContent = 'FALHA no download pelo servidor: ' + (data.error || 'erro desconhecido') + (data.upstreamStatus ? ' (HTTP ' + data.upstreamStatus + ')' : '') + (data.reason ? ' (' + data.reason + ')' : '');
  } catch (_) {
    status.textContent = 'FALHA: endpoint de teste indisponível.';
  }
};
img.src = '/api/apify-photo-proxy';
</script>
</body>
</html>
